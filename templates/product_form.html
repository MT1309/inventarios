{% extends 'base.html' %}
{% block content %}
<h2>{{ action }} producto</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input class="form-control" name="name" value="{{ product.name if product else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">SKU</label>
    <input class="form-control" name="sku" value="{{ product.sku if product else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Stock inicial</label>
    <input class="form-control" name="stock" type="number" min="0" value="{{ product.stock if product else 0 }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Costo unitario</label>
    <input class="form-control" name="cost" type="number" step="0.01"
          value="{{ product.cost if product else 0 }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Precio unitario</label>
    <input class="form-control" name="price" type="number" step="0.01"
          value="{{ product.price if product else 0 }}">
  </div>

  <div class="mb-3">
  <label class="form-label">Categoría</label>
  <select name="category_id" class="form-select">
    <option value="">-- Sin categoría --</option>
    {% for c in categories %}
      <option value="{{ c.id }}"
        {% if product and product.category_id == c.id %}selected{% endif %}>
        {{ c.name }}
      </option>
    {% endfor %}
  </select>
</div>

  <button class="btn btn-primary">{{ action }}</button>
  <a class="btn btn-secondary" href="{{ url_for('products') }}">Cancelar</a>
</form>
{% endblock %}
