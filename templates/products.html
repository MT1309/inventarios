{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Productos</h2>
  <a class="btn btn-primary" href="{{ url_for('new_product') }}">Nuevo producto</a>
</div>
<table class="table table-striped">
<thead><tr><th>Nombre</th><th>SKU</th><th>Stock</th><th></th></tr></thead>
<tbody>
{% for p in products %}
<tr>
  <td>{{ p.name }}</td>
  <td>{{ p.sku or '' }}</td>
  <td>{{ p.stock }}</td>
  <td>
    <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('edit_product', product_id=p.id) }}">Editar</a>
    <a class="btn btn-sm btn-success" href="{{ url_for('new_purchase') }}">Compra</a>
    <a class="btn btn-sm btn-danger" href="{{ url_for('new_sale') }}">Venta</a>
  </td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
